<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Streaming Base-2 Softmax validation passed</title>
  <desc id="desc">Presentation graphic showing the validated online recurrence, PyTorch numerical parity, and bounded key-tile score storage without an N by N score matrix.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1422"/>
      <stop offset="1" stop-color="#101e30"/>
    </linearGradient>
    <linearGradient id="pass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30d6a0"/>
      <stop offset="1" stop-color="#22b978"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#9bb2cd" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000b16" flood-opacity=".34"/>
    </filter>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .muted { fill: #91a4bc; }
      .white { fill: #f2f7fc; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1450" cy="65" r="260" fill="#377bd0" opacity=".07"/>
  <circle cx="135" cy="860" r="260" fill="#25c891" opacity=".045"/>

  <text x="84" y="74" fill="#72aaff" font-size="17" font-weight="700" letter-spacing="3">VITAL HARDWARE  /  SPRINT 1</text>
  <text x="84" y="132" class="white" font-size="40" font-weight="750">STREAMING BASE-2 SOFTMAX</text>
  <text x="84" y="169" class="muted" font-size="20">Algorithmic model validation</text>

  <g filter="url(#shadow)">
    <rect x="1240" y="57" width="278" height="100" rx="22" fill="#12352f" stroke="#2ad49b" stroke-opacity=".58"/>
    <circle cx="1285" cy="107" r="20" fill="url(#pass)"/>
    <path d="M1275 107l7 7 14-16" fill="none" stroke="#08251f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1320" y="103" fill="#67e4b7" font-size="14" font-weight="700" letter-spacing="2">VALIDATION</text>
    <text x="1320" y="133" class="white" font-size="25" font-weight="800">PASSED</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="84" y="211" width="1432" height="313" rx="26" fill="#142338" stroke="#263b55"/>
  </g>
  <text x="120" y="255" fill="#72aaff" font-size="15" font-weight="750" letter-spacing="2">ONLINE RECURRENCE</text>
  <text x="120" y="290" class="white" font-size="22" font-weight="700">Consume one query's keys as small tiles</text>

  <g>
    <rect x="120" y="329" width="232" height="118" rx="17" fill="#1c3048" stroke="#3e5877"/>
    <text x="143" y="362" fill="#c8d8eb" font-size="14" font-weight="650" letter-spacing="1">STREAMING INPUT</text>
    <text x="143" y="398" class="white mono" font-size="20">q, K[t:t+B]</text>
    <text x="143" y="426" class="muted" font-size="15">matching value tile V</text>

    <path d="M369 388h44" stroke="#6f91b8" stroke-width="2.5"/>
    <path d="m406 380 9 8-9 8" fill="none" stroke="#6f91b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="430" y="329" width="209" height="118" rx="17" fill="#1c3048" stroke="#3e5877"/>
    <text x="454" y="362" fill="#c8d8eb" font-size="14" font-weight="650" letter-spacing="1">SCORE TILE</text>
    <text x="454" y="398" class="white mono" font-size="20">x = q · k</text>
    <text x="454" y="426" class="muted" font-size="15">scale, Q12 quantize</text>

    <path d="M657 388h44" stroke="#6f91b8" stroke-width="2.5"/>
    <path d="m694 380 9 8-9 8" fill="none" stroke="#6f91b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="718" y="329" width="374" height="118" rx="17" fill="#152d40" stroke="#2aa987" stroke-opacity=".8"/>
    <text x="742" y="362" fill="#62dfb3" font-size="14" font-weight="700" letter-spacing="1">UPDATE RUNNING STATE</text>
    <text x="742" y="388" class="white mono" font-size="15">m′ = max(m, x)</text>
    <text x="742" y="411" class="white mono" font-size="15">α = exp(m−m′)   β = exp(x−m′)</text>
    <text x="742" y="434" class="white mono" font-size="15">l′ = αl+β   a′ = αa+βv</text>

    <path d="M1110 388h44" stroke="#6f91b8" stroke-width="2.5"/>
    <path d="m1147 380 9 8-9 8" fill="none" stroke="#6f91b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="1170" y="329" width="310" height="118" rx="17" fill="#1c3048" stroke="#3e5877"/>
    <text x="1194" y="362" fill="#c8d8eb" font-size="14" font-weight="650" letter-spacing="1">NORMALIZED OUTPUT</text>
    <text x="1194" y="402" class="white mono" font-size="21">attention = a / l</text>
    <text x="1194" y="428" class="muted" font-size="15">one output vector</text>
  </g>

  <rect x="120" y="471" width="1360" height="1" fill="#2c4159"/>
  <circle cx="139" cy="496" r="7" fill="#51d6a8"/>
  <text x="158" y="502" fill="#d5e2ef" font-size="16">64-entry fractional LUT</text>
  <circle cx="405" cy="496" r="7" fill="#51d6a8"/>
  <text x="424" y="502" fill="#d5e2ef" font-size="16">Q15 exponential weights</text>
  <circle cx="710" cy="496" r="7" fill="#51d6a8"/>
  <text x="729" y="502" fill="#d5e2ef" font-size="16">integer exponent shifts</text>
  <text x="1480" y="502" fill="#91a4bc" font-size="14" text-anchor="end">FP64 value accumulator in this model</text>

  <text x="84" y="582" fill="#72aaff" font-size="15" font-weight="750" letter-spacing="2">REFERENCE COMPARISON</text>
  <text x="84" y="617" class="white" font-size="22" font-weight="700">NumPy model vs. PyTorch Softmax</text>

  <g filter="url(#shadow)">
    <rect x="84" y="646" width="446" height="157" rx="20" fill="#142338" stroke="#263b55"/>
    <rect x="554" y="646" width="446" height="157" rx="20" fill="#142338" stroke="#263b55"/>
    <rect x="1024" y="646" width="492" height="157" rx="20" fill="#142338" stroke="#263b55"/>
  </g>

  <text x="116" y="682" fill="#91a4bc" font-size="14" font-weight="700" letter-spacing="1.5">SOFTMAX PROBABILITIES</text>
  <text x="116" y="732" class="white" font-size="34" font-weight="750">0.00229</text>
  <text x="116" y="768" fill="#57d9aa" font-size="15" font-weight="700">MAX ABS ERROR  ·  PASS</text>
  <text x="116" y="791" class="muted" font-size="13">allowed: 2% relative + 0.0002 absolute</text>

  <text x="586" y="682" fill="#91a4bc" font-size="14" font-weight="700" letter-spacing="1.5">STREAMING ATTENTION OUTPUT</text>
  <text x="586" y="732" class="white" font-size="34" font-weight="750">0.00116</text>
  <text x="586" y="768" fill="#57d9aa" font-size="15" font-weight="700">MAX ABS ERROR  ·  PASS</text>
  <text x="586" y="791" class="muted" font-size="13">allowed: 2.5% relative + 0.002 absolute</text>

  <text x="1056" y="682" fill="#91a4bc" font-size="14" font-weight="700" letter-spacing="1.5">STREAMING / STORAGE CHECK</text>
  <text x="1056" y="730" class="white" font-size="27" font-weight="750">NO N × N SCORE MATRIX</text>
  <text x="1056" y="763" fill="#57d9aa" font-size="15" font-weight="700">TILE SIZES 13 AND 64 → IDENTICAL OUTPUT</text>
  <text x="1056" y="790" class="muted" font-size="13">196 keys · 32-d query · 16-d output</text>

  <rect x="84" y="830" width="1432" height="1" fill="#344960"/>
  <text x="84" y="865" fill="#91a4bc" font-size="14">PYTHON / NUMPY MODEL  ·  DETERMINISTIC TESTS  ·  PYTORCH CPU REFERENCE</text>
  <text x="1516" y="865" fill="#91a4bc" font-size="14" text-anchor="end">Algorithmic validation only — not FPGA hardware verification</text>
</svg>